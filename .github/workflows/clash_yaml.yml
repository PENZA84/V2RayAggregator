name: clash_yaml

# Условия запуска
on:
  workflow_dispatch: # Ручной запуск

  push:
    paths:
      - "./EternityBase/**" # Запуск, если изменилось что-то в папке

  schedule:
    # Автоматический запуск: в 02:45 и 14:45 каждый день
    - cron: "45 2,14 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 📥 Копируем код репозитория
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # 🐍 Устанавливаем Python (последняя совместимая версия)
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Вместо "3.x" — точнее и стабильнее
          cache: "pip" # Встроенное кэширование, старое убрала

      # ⏱ Устанавливаем часовой пояс
      - name: Set Timezone
        run: |
          sudo timedatectl set-timezone 'Asia/Tehran'
          echo "Время: $(date)"

      # 📦 Устанавливаем зависимости
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./utils/requirements.txt
          pip install requests httpx urllib3 # Дополнительно для надёжности

      # ⚙️ Запускаем конвертацию и фильтрацию
      - name: Run Lite Speedtest / Converter
        run: |
          # Скачиваем и запускаем конвертер
          wget -q -O subconverter.tar.gz https://github.com/tindy2013/subconverter/releases/download/v0.7.2/subconverter_linux64.tar.gz
          tar -zxf subconverter.tar.gz -C ./
          chmod +x ./subconverter/subconverter
          nohup ./subconverter/subconverter > ./subconverter.log 2>&1 &

          # Запускаем основной скрипт
          python ./utils/eternity_convert.py

          # Очистка за собой
          rm -f subconverter.tar.gz || true
          rm -rf subconverter/ || true
          rm -f subconverter.log || true

      # 💾 Сохраняем изменения
      - name: Commit changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"

          git pull origin master --rebase || true # Без ошибок при конфликте

          git add Eternity.yml || true
          git add Eternity/ || true
          git add README.md || true
          git add ./update/ || true
          git add LogInfo.txt || true

          # Не делаем пустой коммит
          if git diff --staged --quiet; then
            echo "📊 Нет изменений — коммит не требуется."
          else
            git commit -m "♻️ $(date '+%Y-%m-%d %H:%M:%S') ✅ Filter Nodes updated"
          fi

      # 🚀 Отправляем в репозиторий
      - name: Push Change
        uses: ad-m/github-push-action@master
        with:
          with:
            branch: master
            github_token: ${{ secrets.GITHUB_TOKEN }} # Встроенный токен, ничего создавать не нужно
