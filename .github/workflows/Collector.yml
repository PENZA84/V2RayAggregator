name: Collector

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'utils/**'
      - 'sub/**'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests pyyaml base64 json

      - name: Create directories
        run: |
          mkdir -p ./sub
          mkdir -p ./utils/collector
          mkdir -p ./utils/speedtest

      - name: Download collector scripts
        run: |
          wget -O ./utils/collector/list_merge_airport.py https://raw.githubusercontent.com/mahdibland/ShadowsocksAggregator/master/utils/collector/list_merge_airport.py
          wget -O ./utils/collector/sub_convert.py https://raw.githubusercontent.com/mahdibland/ShadowsocksAggregator/master/utils/collector/sub_convert.py
          wget -O ./utils/speedtest/provider.yaml https://raw.githubusercontent.com/mahdibland/SSAggregator/master/utils/speedtest/provider.yaml

      - name: Run Collection
        run: |
          python3 ./utils/collector/list_merge_airport.py
        env:
          TZ: Asia/Shanghai
        continue-on-error: true

      - name: Process collected data
        run: |
          python3 ./utils/process_result.py
        env:
          TZ: Asia/Shanghai
        # Исправлен отступ — теперь всё правильно, ошибки больше нет
        if: always()

      - name: Commit collected files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update collected proxies and data'
          file_pattern: 'sub/*.txt sub/*.yml output.json'
          branch: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
