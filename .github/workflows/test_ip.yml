name: test_ip

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'utils/test_ip/**'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run IP Test
        run: |
          python3 ./utils/test_ip/check.py
        env:
          TZ: Asia/Shanghai

      - name: Save Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update IP test results'
          file_pattern: 'utils/test_ip/*.json utils/test_ip/*.txt'
          branch: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
